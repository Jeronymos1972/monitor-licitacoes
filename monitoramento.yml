name: Execucao Diaria do Monitor de Licitacoes

on:
  schedule:
    # Executa todos os dias às 08:00 UTC (05:00 Horário de Brasília)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite execução manual

# Necessário para o robô gravar o banco de dados de volta no repositório
permissions:
  contents: write

# Evita duas execuções simultâneas (e conflito no commit do banco)
concurrency:
  group: monitor-licitacoes
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar dependências
      run: pip install requests

    - name: Executar Script de Monitoramento
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        PYTHONUNBUFFERED: '1'
      run: python main.py

    # Salva o banco no repositório para não reenviar as mesmas licitações amanhã
    - name: Salvar banco de dados de licitações já enviadas
      if: always()
      run: |
        if [ -f licitacoes_geociencias.db ]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f licitacoes_geociencias.db
          if ! git diff --staged --quiet; then
            git commit -m "Atualiza banco de licitações [skip ci]"
            git push
          fi
        fi
