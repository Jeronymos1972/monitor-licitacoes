name: Monitoramento diário de licitações

on:
  schedule:
    # 08:00 UTC = 05:00 no horário de Brasília
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoramento-licitacoes
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: python -m pip install --upgrade pip requests

      # Cada execução salva um novo cache; a próxima restaura o banco anterior.
      # Isso reduz alertas repetidos entre execuções, mas não substitui banco externo.
      - name: Restaurar histórico de licitações
        uses: actions/cache@v4
        with:
          path: licitacoes_geociencias.db
          key: licitacoes-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            licitacoes-${{ github.ref_name }}-

      - name: Validar configuração do Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_TOKEN" || (echo "::error::Secret TELEGRAM_TOKEN não configurado" && exit 1)
          test -n "$TELEGRAM_CHAT_ID" || (echo "::error::Secret TELEGRAM_CHAT_ID não configurado" && exit 1)

      - name: Executar monitoramento
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIAS_A_FRENTE: "30"
          LOG_LEVEL: INFO
        run: python main.py
