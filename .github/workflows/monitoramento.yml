
name: Monitoramento diário de licitações

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoramento-licitacoes
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Restaurar histórico de licitações
        uses: actions/cache@v5
        with:
          path: licitacoes_geociencias.db
          key: licitacoes-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            licitacoes-${{ github.ref_name }}-

      - name: Validar configuração do Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_TOKEN" || exit 1
          test -n "$TELEGRAM_CHAT_ID" || exit 1

      - name: Executar monitoramento
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIAS_A_FRENTE: "30"
          LOG_LEVEL: INFO
        run: python main.py
